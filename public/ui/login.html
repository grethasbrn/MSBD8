<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Sanggar Tri Arga</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: #f4ebd0;
        }
        .auth-card {
            background: #fdfbf7;
            width: min(450px, 100%);
            padding: 40px 35px;
            border-radius: 16px;
            border: 2px solid var(--gold);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
            position: relative;
            overflow: hidden;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .auth-logo {
            height: 60px;
            width: 60px;
            object-fit: contain;
            border-radius: 50%;
            background: var(--gold-light);
            padding: 2px;
            border: 2px solid var(--gold);
            margin-bottom: 12px;
        }
        .auth-header h2 {
            font-family: "Times New Roman", Times, serif;
            font-size: 28px;
            color: var(--maroon);
            font-weight: 700;
        }
        .auth-header p {
            font-size: 13px;
            color: var(--muted);
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--maroon);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #d4c5a9;
            background: #ffffff;
            font-family: inherit;
            font-size: 14px;
            color: var(--navy);
        }
        .form-extra {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 20px;
            color: var(--navy);
        }
        .form-extra label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .form-extra a {
            color: var(--maroon);
            text-decoration: underline;
        }
        .error-msg {
            color: #d9534f;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        .btn-auth {
            width: 100%;
            background: var(--maroon);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid var(--gold);
            transition: 0.25s;
            box-shadow: 0 4px 12px rgba(74, 18, 21, 0.2);
        }
        .btn-auth:hover {
            background: var(--maroon-dark);
        }
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--muted);
        }
        .auth-footer a {
            color: #0055ff;
            font-weight: bold;
            text-decoration: underline;
        }
        .back-home {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: var(--navy);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <section class="auth-section">
        <div class="auth-card">
            <div class="auth-header">
                <img src="images/logo.png" alt="Logo Sanggar Tri Arga" class="auth-logo">
                <h2>Masuk Akun</h2>
                <p>Silakan masuk untuk melanjutkan pemesanan</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginUser">Email atau Username</label>
                    <input type="text" id="loginUser" required placeholder="Masukkan email / username">
                    <div class="error-msg" id="errUser">Email atau username wajib diisi.</div>
                </div>

                <div class="form-group">
                    <label for="loginPass">Kata Sandi (Password)</label>
                    <input type="password" id="loginPass" required placeholder="Masukkan kata sandi">
                    <div class="error-msg" id="errPass">Kata sandi wajib diisi.</div>
                </div>

                <div class="form-extra">
                    <label>
                        <input type="checkbox" id="rememberMe"> Ingat Saya (Remember Me)
                    </label>
                    <a href="#" onclick="alert('Fitur Lupa Password akan segera dihubungkan ke backend database.')">Lupa Password?</a>
                </div>

                <button type="submit" class="btn-auth">Masuk</button>
            </form>

            <div class="auth-footer">
                Belum punya akun? <a href="register.html">Sign Up (Daftar)</a>
            </div>

            <a href="index.html" class="back-home">← Kembali ke Beranda</a>
        </div>
    </section>

    <script src="js/api.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const user = document.getElementById('loginUser').value.trim();
        const pass = document.getElementById('loginPass').value.trim();
        let isValid = true;

        document.getElementById('errUser').style.display = 'none';
        document.getElementById('errPass').style.display = 'none';

        if (!user) { document.getElementById('errUser').style.display = 'block'; isValid = false; }
        if (!pass) { document.getElementById('errPass').style.display = 'block'; isValid = false; }
        if (!isValid) return;

        const tombol = this.querySelector('.btn-auth');
        tombol.disabled = true;
        tombol.textContent = 'Memproses...';

        try {
            const data = await api('/auth/login', { method: 'POST', body: { login: user, password: pass } });

            if (data.user.role !== 'customer') {
                throw new Error('Akun ini milik tim sanggar. Silakan masuk lewat halaman Login Pekerja.');
            }
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            location.href = 'pesan.html';
        } catch (err) {
            const el = document.getElementById('errPass');
            el.textContent = err.message;
            el.style.display = 'block';
        } finally {
            tombol.disabled = false;
            tombol.textContent = 'Masuk';
        }
    });
</script>
</body>
</html>
