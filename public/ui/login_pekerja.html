<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Pekerja & Kru - Sanggar Tri Arga</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="body-pekerja">

    <header class="navbar-kru">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="Logo Sanggar Tri Arga" class="logo-img">
                <span>SANGGAR <strong>TRI ARGA</strong></span>
            </a>
        </div>
    </header>

    <div class="login-wrapper">
        
        <section class="banner-top">
            <h1>✦ SELAMAT DATANG, TIM TRI ARGA ✦</h1>
        </section>

        <section class="login-box-bottom">
            <div class="form-header-title">
                <h3>Silakan Pilih Peran Anda untuk Mengakses Dashboard!</h3>
            </div>

            <form id="workerLoginForm">
                <div class="role-grid">
                    
                    <label class="role-option" style="grid-column: span 2;">
                        <input type="radio" name="role" value="owner" checked>
                        <div class="role-card">
                            <strong>OWNER</strong>
                            <small>Pemilik & Penanggung Jawab Keuangan</small>
                        </div>
                    </label>

                    <label class="role-option">
                        <input type="radio" name="role" value="korlap">
                        <div class="role-card">
                            <strong>KORLAP</strong>
                            <small>Koordinator Lapangan & Tim</small>
                        </div>
                    </label>

                    <label class="role-option">
                        <input type="radio" name="role" value="helper">
                        <div class="role-card">
                            <strong>HELPER</strong>
                            <small>Logistik, Kostum & Alat Musik</small>
                        </div>
                    </label>

                    <label class="role-option">
                        <input type="radio" name="role" value="penari">
                        <div class="role-card">
                            <strong>PENARI</strong>
                            <small>Tim Pertunjukan Tari</small>
                        </div>
                    </label>

                    <label class="role-option">
                        <input type="radio" name="role" value="pemusik">
                        <div class="role-card">
                            <strong>PEMUSIK</strong>
                            <small>Tim Pertunjukan Musik & Instrumen</small>
                        </div>
                    </label>

                </div>

                <div class="inputs-group">
                    <div class="form-group">
                        <label for="worker_id">USERNAME</label>
                        <input type="text" id="worker_id" class="form-control" placeholder="Contoh: @blabla" required>
                    </div>

                    <div class="form-group">
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit-login">
                    MASUK DASHBOARD PEKERJA <span>→</span>
                </button>
            </form>
        </section>

    </div>

    <script src="js/api.js"></script>
<script>
    document.getElementById('workerLoginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const peran = document.querySelector('input[name="role"]:checked').value;
        const tombol = this.querySelector('.btn-submit-login');
        tombol.disabled = true;

        try {
            const data = await api('/auth/login', {
                method: 'POST',
                body: {
                    login: document.getElementById('worker_id').value.trim(),
                    password: document.getElementById('password').value,
                },
            });

            // Peran yang dipilih harus sama dengan peran asli akun di database
            if (data.user.role !== peran) {
                throw new Error('Akun ini terdaftar sebagai ' + data.user.role.toUpperCase() +
                                ', bukan ' + peran.toUpperCase() + '. Pilih peran yang sesuai.');
            }
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            location.href = 'dashboard_' + peran + '.html';
        } catch (err) {
            alert(err.message);
        } finally {
            tombol.disabled = false;
        }
    });
</script>
</body>
</html>
